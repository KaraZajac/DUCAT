# One workspace, so `cargo test` at the root covers everything that must agree
# and every crate shares a target directory rather than keeping its own.
#
# The research crates are deliberately excluded: they pin old dependency
# versions on purpose (they are measurements of what a version did), and
# unifying their features with the working crates would silently change what
# they measured.
[workspace]
resolver = "2"
members = ["core", "sim", "harness", "mobile"]
exclude = ["research"]

# The native library ships inside an APK, once per ABI, so its size is the app's
# size three times over. Unstripped it was 30 MB per architecture.
[profile.release]
strip = true          # debug symbols are the bulk of it
lto = true            # veilid pulls a large dependency tree; cross-crate inlining pays
codegen-units = 1     # slower to build, smaller to ship
opt-level = "z"       # size over speed: nothing here is compute-bound except
                      # Argon2, which is deliberately slow anyway
