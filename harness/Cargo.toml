[package]
name = "ducat-harness"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
ducat-core = { path = "../core" }
# The harness drives the shipped ceremony engine (§17.9) over a real thread,
# so --dkg-run tests the exact code the app runs, not a reimplementation.
ducat-mobile = { path = "../mobile" }
veilid-core = "0.5"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2"
