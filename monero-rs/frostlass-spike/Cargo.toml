[package]
name = "frostlass-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
monero-wallet = { version = "0.2.0", features = ["multisig"] }
modular-frost = { version = "0.11.1", features = ["ed25519", "tests"] }
dkg-dealer = "0.6"
dkg = "0.6"
curve25519-dalek = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
hex = "0.4"
monero-simple-request-rpc = "0.1.0"
tokio = { version = "1.53.1", features = ["full"] }
