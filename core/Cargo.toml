[package]
name = "ducat-core"
version = "0.1.0"
edition = "2021"
description = "DUCAT protocol core: deterministic codec, domain-separated signing, contract state machine"

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
