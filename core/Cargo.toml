[package]
name = "ducat-core"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "DUCAT protocol core: deterministic codec, domain-separated signing, contract state machine"

[dependencies]
argon2 = "0.5.3"
# Already in the tree via veilid-core (VLD0's hash); named here so the
# publication key schedule can speak it directly.
blake3 = "1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hpke = { version = "0.14", default-features = false, features = ["x25519", "alloc", "chacha", "hkdfsha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
unicode-normalization = "0.1.25"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
hpke = { version = "0.14", default-features = false, features = ["x25519", "alloc", "chacha", "hkdfsha2"] }
