[package]
name = "ducat-app"
version = "0.1.0"
edition = "2021"
description = "DUCAT's application logic, in Rust, shared by every client"
license = "MPL-2.0"

# The layer between the protocol and a screen.
#
# The phone keeps this logic in Kotlin — stores, the mailbox's send/poll,
# publishing, the poll lap — and the Compose desk compiles those same
# files against an Android shim, which is how the two stayed one
# implementation. A desk that is not a JVM cannot do that, so the logic
# moves here, where a Tauri desk links it directly and the phone reaches it
# through uniffi. One implementation, two doors.
#
# Milestone 1 is the publishing half: releases (a file at an address that
# cannot change) and sites (one mutable head at a stable key). Both are
# thin over the swarm and the DHT, both are what a desk is for, and neither
# touches the mailbox — which is the hard part and comes second.

[lib]
name = "ducat_app"
path = "src/lib.rs"

[dependencies]
ducat-mobile = { path = "../mobile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "1"
