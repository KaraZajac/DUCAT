[package]
name = "ducat-app"
version = "0.1.0"
edition = "2021"
description = "DUCAT's application logic, in Rust, shared by every client"
license = "MPL-2.0"

# The layer between the protocol and a screen.
#
# The phone keeps this logic in Kotlin — stores, the mailbox's send/poll,
# publishing, the poll lap — and the Compose desk compiles those same
# files against an Android shim, which is how the two stayed one
# implementation. A desk that is not a JVM cannot do that, so the logic
# moves here, where a Tauri desk links it directly and the phone reaches it
# through uniffi. One implementation, two doors.
#
# What is here: identity and the persona roster, contacts and the mailbox
# (cards, send, poll, the dead-letter rules), the wallet (scan, send, the
# intent ledger), tabs and the till, the catalogue, publications (press and
# reading room), groups, listings and the boards, the ledger and its
# exports, backup bundles, attachments, standing bills, donations, releases
# and sites — with the lap that turns it all while a window is open. Each
# module names the phone file it was ported from; the JSON it keeps uses
# the phone's keys, so one log line reads the same on both.

[lib]
name = "ducat_app"
path = "src/lib.rs"

[dependencies]
ducat-mobile = { path = "../mobile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Thumbnails for the board: decode what a person picks, encode a JPEG under the cap.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
thiserror = "1"
