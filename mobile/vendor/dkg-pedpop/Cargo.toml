# Vendored dkg-pedpop 0.6.0, one line changed: multiexp 0.4 → 0.5.
#
# The crates.io release is internally inconsistent against monero-wallet
# 0.2.0's stack: it pins multiexp 0.4 while schnorr-signatures 0.5.3 (which
# it also uses) resolves multiexp 0.5 in the same graph, so its BatchVerifier
# is 0.4's and the type it hands schnorr::batch_verify is 0.5's — they don't
# match and it won't compile. multiexp 0.4 and 0.5 have the identical
# BatchVerifier API (new / queue / verify_vartime_with_vartime_blame), so
# repointing dkg-pedpop at 0.5 unifies the graph on one multiexp and the
# source compiles unchanged. This is the version-matched interactive DKG
# §17.9 needs; when upstream ships a coherent release, drop this vendor.
[package]
name = "dkg-pedpop"
version = "0.6.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
name = "dkg_pedpop"

[dependencies]
thiserror = { version = "2", default-features = false, features = ["std"] }
rand_core = { version = "0.6", default-features = false, features = ["std"] }
zeroize = { version = "^1.5", default-features = false, features = ["std", "zeroize_derive"] }
chacha20 = { version = "0.9", default-features = false, features = ["std", "zeroize"] }
transcript = { package = "flexible-transcript", version = "^0.3.3", default-features = false, features = ["std", "recommended"] }
multiexp = { version = "0.5", default-features = false, features = ["std", "batch"] }
ciphersuite = { version = "^0.4.1", default-features = false, features = ["std"] }
schnorr = { package = "schnorr-signatures", version = "^0.5.1", default-features = false, features = ["std"] }
dleq = { version = "^0.4.1", default-features = false, features = ["std", "serialize"] }
dkg = { version = "0.6", default-features = false, features = ["std"] }
