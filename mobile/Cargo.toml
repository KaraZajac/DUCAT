[package]
name = "ducat-mobile"
version = "0.1.0"
edition = "2021"

# cdylib for the JNI .so the app loads; staticlib kept so an iOS target can use
# the same crate without a second wrapper.
[lib]
name = "ducat_mobile"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
ducat-core = { path = "../core" }
# A wallet on the phone, because there is no monero-wallet-rpc on a phone.
monero-wallet = { version = "0.2.0", features = ["multisig"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
thiserror = "1"
veilid-core = "0.5"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
uniffi = { version = "0.28", features = ["cli"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# Veilid needs the JavaVM and Android Context before a node can start, and that
# cannot travel through UniFFI — a Context is a Java object, not a value. So one
# hand-written JNI export, against the same jni version veilid-core uses;
# a mismatch here is a silent ABI difference rather than a compile error.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
