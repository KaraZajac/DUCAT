[package]
name = "ducat-mobile"
version = "0.1.0"
edition = "2021"

# cdylib for the JNI .so the app loads; staticlib kept so an iOS target can use
# the same crate without a second wrapper.
[lib]
name = "ducat_mobile"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
ducat-core = { path = "../core" }
# A wallet on the phone, because there is no monero-wallet-rpc on a phone.
monero-wallet = { version = "0.2.0", features = ["multisig"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
thiserror = "1"
veilid-core = "0.5"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
uniffi = { version = "0.28", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
