[package]
name = "ducat-mobile"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

# cdylib for the JNI .so the app loads; staticlib kept so an iOS target can use
# the same crate without a second wrapper.
[lib]
name = "ducat_mobile"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
ducat-core = { path = "../core" }
# A wallet on the phone, because there is no monero-wallet-rpc on a phone.
monero-wallet = { version = "0.2.0", features = ["multisig"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
thiserror = "1"
veilid-core = "0.5"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
uniffi = { version = "0.28", features = ["cli"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
monero-simple-request-rpc = "0.1.0"
monero-daemon-rpc = "0.2.0"
sha2 = "0.10"
ed25519-dalek = "2"

[dev-dependencies]
# The escrow demo (examples/escrowtest.rs): 2-of-2 threshold keys and FROST
# signing over the same stack monero-wallet's multisig feature uses.
modular-frost = { version = "0.11.1", features = ["ed25519"] }
# The vendored dkg-pedpop (see mobile/vendor/dkg-pedpop) is the version-
# matched interactive DKG §17.9 needs; crates.io's release drags an
# incompatible multiexp. This gives the escrow demo a real no-dealer keygen.
dkg-pedpop = { path = "vendor/dkg-pedpop" }
ciphersuite = "0.4"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# Veilid needs the JavaVM and Android Context before a node can start, and that
# cannot travel through UniFFI — a Context is a Java object, not a value. So one
# hand-written JNI export, against the same jni version veilid-core uses;
# a mismatch here is a silent ABI difference rather than a compile error.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
