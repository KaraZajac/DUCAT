# What must be true of every commit.
#
# Until now none of this ran unless someone typed it: 241 vectors, a second
# implementation, a spec audit and a render test, all invoked by hand. That
# was survivable while the two clients were independent. They are not — the
# desk compiles the phone's own screens, so a phone-side edit can break the
# desk silently, and the only thing that catches it is a build nobody was
# running.
name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: protocol — vectors, second impl, spec audit, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Three primitives the second implementation does not re-derive: a
      # schema validator, signature verification, Argon2id. Undeclared until
      # this workflow existed and found them missing on a clean machine.
      - name: the checkers' own dependencies
        run: python3 -m pip install --quiet -r conformance/requirements.txt

      # A dependency nobody declared shows up on a clean machine as a
      # *crashed vector*, which looks exactly like a disagreement — the worst
      # possible disguise for a missing package. This fails on the import
      # rather than on the vector.
      - name: no undeclared dependencies
        run: python3 conformance/check_requirements.py

      # Cheapest first, and the ones that catch the most: a vector that no
      # longer validates, a second implementation that disagrees, or a
      # sentence in the spec that stopped describing the code.
      - name: vectors validate against the schema
        run: python3 conformance/validate_vectors.py

      - name: the second implementation agrees
        run: python3 conformance/ducat_check.py

      - name: the document matches the code
        run: python3 conformance/audit_spec.py

      - name: cargo test
        run: cargo test --workspace

  clients:
    name: clients — phone builds, desk builds, screens draw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('applications/**/*.gradle.kts', 'applications/gradle/**') }}
          restore-keys: gradle-${{ runner.os }}-

      # The desk loads this through JNA at runtime; the render test really
      # does call into it, because the screens it draws read a real wallet.
      - name: build the host Rust library
        run: cargo build --release -p ducat-mobile

      # Placeholders, scripts and plural classes across every language.
      # Written after Russian words bled into the Japanese onboarding copy
      # and the build was perfectly happy about it.
      - name: the translations agree
        run: python3 applications/check_strings.py

      # The phone's Rust is built here, not fetched: jniLibs/ is ignored by
      # git, so a checkout has no native library at all, and Gradle's
      # freshness check waves an empty directory through — the APK this
      # job used to produce launched and crashed on the first bridge call.
      # One ABI keeps the job honest without tripling it; the release
      # workflow builds all three.
      - name: the phone's native library, arm64
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          DUCAT_ABIS: "aarch64-linux-android:arm64-v8a"
        run: |
          rustup target add aarch64-linux-android
          echo y | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" >/dev/null
          bash mobile/build-android.sh

      - name: the phone compiles
        run: cd applications && ./gradlew --no-daemon :android:assembleDebug

      - name: keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug.apk
          path: applications/android/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          retention-days: 14

      - name: the phone's unit tests
        run: cd applications && ./gradlew --no-daemon :android:testDebugUnitTest

      - name: the desk compiles
        run: cd applications && ./gradlew --no-daemon :desktop:build

      # The resource bridge and the shim layer the phone's screens stand on.
      # The arithmetic behind the promise users are given out loud.
      - name: the stake sums add up
        run: cd applications && ./gradlew --no-daemon :desktop:staketest

      - name: the shim layer holds
        run: cd applications && ./gradlew --no-daemon :desktop:restest :desktop:shimtest

      # Encryption at rest, checked by looking for the secret in the bytes.
      - name: the desk's vault keeps its secret
        env:
          DUCAT_DESK_STATE: ${{ runner.temp }}/desk-vault
        run: cd applications && ./gradlew --no-daemon :desktop:vaulttest

      - name: backup round-trip, profile scoping, read marks
        run: cd applications && ./gradlew --no-daemon :desktop:backuptest :desktop:profilescope :desktop:markstest

      # What bytes are allowed to carry, in and out. Two guard what a
      # stranger's bytes may *name*: a publisher's period id becomes a
      # directory under the reader's library, a site's address becomes the
      # directory its bundle renders from, and both were reachable from the
      # network with nothing watching them. One guards what our own bytes
      # take *with* them — a photo leaves as pixels, not as a file with the
      # photographer's doorstep written into it. And one covers the only
      # thing in the tab store that deletes without being asked.
      - name: what bytes may name, and what they may carry
        env:
          DUCAT_DESK_STATE: ${{ runner.temp }}/desk-paths
          DUCAT_WANTED_STATE: ${{ runner.temp }}/desk-wanted
        run: cd applications && ./gradlew --no-daemon :desktop:periodidtest :desktop:sitedirtest :desktop:sweeptest :desktop:exiftest :desktop:clocktest :desktop:piecebartest :desktop:releaseaddrtest :desktop:wantedtest

      # Compiling is not drawing. This renders every hosted screen with no
      # display attached and fails on a blank rectangle — it is what caught
      # two rooms that crashed on first composition.
      - name: every screen draws
        env:
          DUCAT_DESK_STATE: ${{ runner.temp }}/desk-render
        run: cd applications && ./gradlew --no-daemon :desktop:rendertest

      # Kept when a screen goes blank, so the failure can be looked at
      # rather than reasoned about.
      - name: keep the renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-renders
          path: ${{ runner.temp }}/desk-render/renders
          if-no-files-found: ignore
          retention-days: 7

  desk:
    name: desk — the Tauri client compiles, its pages type-check, its strings agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            applications/desk/src-tauri/target
          key: desk-${{ runner.os }}-${{ hashFiles('applications/desk/src-tauri/Cargo.lock', '**/Cargo.lock') }}
          restore-keys: desk-${{ runner.os }}-

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: applications/desk/pnpm-lock.yaml

      # What a webview needs to link against, and the sound library the
      # calls feature compiles for on Linux.
      - name: the window's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: the desk's dependencies
        run: cd applications/desk && pnpm install --frozen-lockfile

      # The dictionaries are generated from the phone's resources and
      # committed; a phone-side string edit must be carried over, not lost.
      - name: the desk's strings agree with the phone's
        run: python3 applications/desk/scripts/strings_from_android.py --check

      - name: the pages type-check
        run: cd applications/desk && pnpm check

      - name: the desk compiles, with sound
        run: cd applications/desk/src-tauri && cargo build --features sound
