# The desk, packaged where each OS can only package itself: jpackage makes
# .deb/.rpm only on Linux, .msi only on Windows, .dmg only on macOS. A tag
# push (release.sh) starts this; each job builds the host Rust library, the
# desk, and uploads its installers to the release the tag names. The
# Android APKs and the immediate Linux tarball come from release.sh itself,
# so the release is never empty while these build.
name: desk

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x64
          - os: windows-latest
            slug: windows-x64
          - os: macos-latest
            slug: macos-arm64
          # Intel Macs, built on an Apple Silicon runner: the macos-13 label
          # queues forever now that GitHub is retiring it, so instead this
          # job takes an x86_64 JDK (running under Rosetta) and an x86_64
          # Rust target. jpackage bundles the JVM it is itself running on,
          # so an x64 JVM produces an x64 app — no Intel hardware needed.
          - os: macos-latest
            slug: macos-x64
            jdk_arch: x64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rosetta, for the x86_64 JDK on Apple Silicon
        if: matrix.jdk_arch == 'x64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Empty means "this runner's own architecture", which is what
          # every job but the Intel-Mac cross-build wants.
          architecture: ${{ matrix.jdk_arch }}

      - name: Linux packaging tools (rpm beside the preinstalled dpkg)
        if: matrix.slug == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Build the host Rust library
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add "${{ matrix.rust_target }}"
            cargo build --release --target "${{ matrix.rust_target }}" -p ducat-mobile
            # Where the desk's build expects to find it, whoever built it.
            mkdir -p target/release
            cp target/"${{ matrix.rust_target }}"/release/libducat_mobile.dylib target/release/
          else
            cargo build --release -p ducat-mobile
          fi

      - name: Package the desk
        shell: bash
        run: |
          cd applications
          ./gradlew --no-daemon :desktop:packageDistributionForCurrentOS :desktop:createDistributable

      - name: Collect artifacts under stable names
        shell: bash
        run: |
          set -x
          out=applications/desktop/build/compose/binaries/main
          mkdir -p dist
          shopt -s nullglob
          for f in "$out"/deb/*.deb; do cp "$f" "dist/ducat-desk-${{ matrix.slug }}.deb"; done
          for f in "$out"/rpm/*.rpm; do cp "$f" "dist/ducat-desk-${{ matrix.slug }}.rpm"; done
          for f in "$out"/msi/*.msi; do cp "$f" "dist/ducat-desk-${{ matrix.slug }}.msi"; done
          for f in "$out"/dmg/*.dmg; do cp "$f" "dist/ducat-desk-${{ matrix.slug }}.dmg"; done
          # The portable build: unzip-and-run, no installer rights needed.
          # The directory is ducat-desk on Linux/Windows and ducat-desk.app
          # on a Mac — ls, don't guess.
          APP=$(ls "$out/app" | head -1)
          if [ "${{ matrix.slug }}" = "windows-x64" ]; then
            (cd "$out/app" && 7z a "$GITHUB_WORKSPACE/dist/ducat-desk-${{ matrix.slug }}.zip" "$APP")
          else
            tar czf "dist/ducat-desk-${{ matrix.slug }}.tar.gz" -C "$out/app" "$APP"
          fi
          ls -la dist

      - name: Upload to the tag's release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # release.sh creates the release moments after pushing the tag;
          # these jobs spend twenty minutes compiling first, but wait anyway.
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          # The API 503s on its own schedule; one file of several failing
          # must not strand the rest, so keep asking.
          for i in $(seq 1 6); do
            gh release upload "$TAG" dist/* --clobber && exit 0
            echo "upload attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1
