[package]
name = "ducat-desk"
version = "0.1.0"
edition = "2021"
description = "DUCAT on a bigger screen"
license = "MPL-2.0"

# The desk is a window over ducat-app. Every command here is a thin call
# into that crate; nothing about DUCAT is decided in this package, which is
# what lets the phone and the desk stay one implementation.

# Its own workspace, deliberately. Tauri needs webkit2gtk and friends to
# compile, and a machine without them — CI, a phone build box — must still
# be able to `cargo test --workspace` on everything else. Built with
# `pnpm tauri dev` / `pnpm tauri build` from applications/desk, or
# `cargo build --manifest-path applications/desk/src-tauri/Cargo.toml`.
[workspace]

[lib]
name = "ducat_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ducat-app = { path = "../../../app" }
ducat-mobile = { path = "../../../mobile" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# The card as a code the phone can scan; SVG only, no image stack.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[features]
# Real calls: the machine's microphone and speaker. Needs the platform's
# audio development library to build (alsa-lib-devel on Fedora).
sound = ["ducat-app/sound"]

# The same veilid-core the phone builds against, with its one fix; this
# workspace is separate from the root one, so it says so itself.
[patch.crates-io]
veilid-core = { path = "../../../mobile/vendor/veilid-core" }
